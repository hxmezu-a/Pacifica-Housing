name: Pacifica-Housing
version: ${version}
main: com.districtx.housing.HousingPlugin
api-version: '1.20'
author: DistrictX Developers Officials
depend:
  - Vault
softdepend:
  - Pacifica-Core
  - LuckPerms
  - CrackShot
  - WeaponMechanics
commands:
  houses:
    description: Open player house menus
    usage: /houses <owned|realestate>
    aliases: [house]
  myhouses:
    description: Open your owned houses
    usage: /myhouses
  housesadmin:
    description: Administrative house management
    usage: /housesadmin <create|adddoor|addvault|setoutside|setinside|grant|reload>
permissions:
  kodarihousing.admin:
    description: Manage house definitions and ownership
    default: op
  houses.ownlimit.*:
    description: Set the maximum number of houses a player can own through a numbered child permission
    default: false
  house.timer.*:
    description: Set the house entry timer through a numbered child permission
    default: false
  house.timer.instant:
    description: Enter houses without a timer
    default: false